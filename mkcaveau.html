      st.id = NS + "-eula-css";
      st.textContent = EULA_CSS;

    }
    const prev = document.activeElement;
    const ov = document.createElement("div");
    ov.id = NS + "-eula";
    ov.setAttribute("role", "dialog");
    ov.setAttribute("aria-modal", "true");
    ov.setAttribute("aria-labelledby", NS + "-eula-t");
    ov.innerHTML = EULA_BODY;
    document.body.appendChild(ov);
    document.body.style.overflow = "hidden";

    const el = (id) => document.getElementById(NS + "-" + id);
    const txt = el("eula-txt"), c1 = el("c1"), c2 = el("c2"), go = el("eula-go");
    const s1 = el("s1"), s2 = el("s2"), s3 = el("s3");
    const t0 = Date.now();
    let scrolled = false, tmr = null;

    const left = () => Math.max(0, Math.ceil(EULA_WAIT - (Date.now() - t0) / 1000));
    const ready = () => scrolled && left() === 0 && c1.checked && c2.checked;
    const refresh = () => {
      const l = left();
      s1.textContent = scrolled ? "✓ Letto fino in fondo" : "Scorri il testo fino in fondo";
      s2.textContent = l > 0 ? "Attendi " + l + " s" : "✓ Attesa completata";
      s3.textContent = (c1.checked && c2.checked) ? "✓ Due caselle spuntate" : "Spunta le due caselle";
      s1.classList.toggle("ok", scrolled);
      s2.classList.toggle("ok", l === 0);
      s3.classList.toggle("ok", c1.checked && c2.checked);
      go.disabled = !ready();
    };
    const onScroll = () => {
      if (!scrolled && txt.scrollHeight > 0 && txt.scrollTop + txt.clientHeight >= txt.scrollHeight - 6) { scrolled = true; refresh(); }
    };
    const close = () => {
      clearInterval(tmr);
      document.removeEventListener("keydown", onKey, true);
      ov.remove();
      document.body.style.overflow = "";
      if (prev && prev.focus) prev.focus();
    };
    const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };

    txt.addEventListener("scroll", onScroll, { passive: true });
    c1.onchange = c2.onchange = refresh;

    if (it.tx !== undefined) {

    // Danger zone

    delIt.onclick = () => {
      if (!confirm("Eliminare definitivamente questo oggetto?")) return;
      sec.items.splice(state.curItem, 1);
      state.curItem = Math.max(0, state.curItem - 1);

    };
    danger.append(delIt);

    main.replaceChildren(wrap);

  /* ───────────────────────── IMPORT (plain + encrypted) ───────────────────────── */
  function extractVFromHTML(html) {
    let m = html.match(/const\s+V\s*=\s*(\[[\s\S]*?\]);\s*(?:\/\*|const\s+df)/);
    if (!m) m = html.match(/const\s+_VR\s*=\s*(\[[\s\S]*?\]);\s*function\s+__emStrip/);
    if (!m) return null;
    try {
      const data = new Function("return " + m[1])();
      if (!Array.isArray(data)) return null;
      return data;
    } catch (e) {
      console.error(e);
      return null;
    }
  }

  function tryDecryptCamouflage(text) {
    // Outer camouflage: look for atob("...") and XOR 0x13
    const m = text.match(/const\s+b\s*=\s*atob\s*\(\s*"([A-Za-z0-9+/=]+)"\s*\)/);
    if (!m) return null;
    try {
      const b64 = m[1];
      const raw = atob(b64);
      const key = 0x13;
      const d = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) d[i] = raw.charCodeAt(i) ^ key;
      return new TextDecoder().decode(d);
    } catch (e) {
      return null;
    }
  }

  function extractCryptoParams(gateHtml) {
    // Extract SALT, NONCE, DATA, TAG, ITER from the gate shell
    const get = (name) => {
      const re = new RegExp(name + "\\s*=\\s*Uint8Array\\.from\\(atob\\(\"([A-Za-z0-9+/=]+)\"\\)");
      const m = gateHtml.match(re);
      return m ? m[1] : null;
    };
    const salt = get("SALT");
    const nonce = get("NONCE");
    const data = get("DATA");
    const tag = get("TAG");
    const iterM = gateHtml.match(/ITER\s*=\s*(\d+)/);
    const iter = iterM ? +iterM[1] : 1000000;
    if (!salt || !nonce || !data || !tag) return null;
    const gzM = gateHtml.match(/\bGZ\s*=\s*(\d)/);
    return { salt, nonce, data, tag, iter, gz: gzM ? +gzM[1] : 0 };
  }

  async function decryptWithPassword(params, password) {
    const salt = Uint8Array.from(atob(params.salt), c => c.charCodeAt(0));
    const nonce = Uint8Array.from(atob(params.nonce), c => c.charCodeAt(0));
    const data = Uint8Array.from(atob(params.data), c => c.charCodeAt(0));
    const tag = Uint8Array.from(atob(params.tag), c => c.charCodeAt(0));
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: params.iter, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    const cmb = new Uint8Array(data.length + tag.length);
    cmb.set(data);
    cmb.set(tag, data.length);
    const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv: nonce }, key, cmb);
    return new TextDecoder().decode(params.gz ? await gu(dec, params.gz === 2 ? "deflate" : "gzip") : dec);
  }

  function showPasswordPromptForImport(onSubmit, onCancel) {
    const main = document.querySelector("#" + NS + "-main");
    if (!main) return;
    const box = document.createElement("div");
    box.className = "pwdbox";
    box.innerHTML = `
      <h3 style="text-align:center;color:var(--acc2);letter-spacing:.12em">SBLOCCA CAVEAU CRIPTATO</h3>
      <p class="hint" style="text-align:center">Inserisci la password del file che stai importando.<br>Dopo le modifiche potrai cifrarlo di nuovo con la stessa o una nuova password.</p>
      <label>Password del file</label>
      <input type="password" id="${NS}-imp-pwd" autocomplete="off" spellcheck="false" autofocus>
      <div class="actions" style="justify-content:center;margin-top:14px">
        <button class="btn ghost" id="${NS}-imp-cancel">Annulla</button>
        <button class="btn" id="${NS}-imp-go">Sblocca e importa</button>
      </div>
    `;
    main.replaceChildren(box);
    const pwd = document.getElementById(NS + "-imp-pwd");
    document.getElementById(NS + "-imp-cancel").onclick = () => { onCancel(); renderMain(); };
    document.getElementById(NS + "-imp-go").onclick = async () => {
      const v = pwd.value;
      pwd.value = "";
      if (!v) { toast("Inserisci la password"); return; }
      try {
        document.getElementById(NS + "-imp-go").disabled = true;
        document.getElementById(NS + "-imp-go").textContent = "Decifratura…";
        await onSubmit(v);
      } catch (err) {
        toast("Password errata o file corrotto");
        document.getElementById(NS + "-imp-go").disabled = false;
        document.getElementById(NS + "-imp-go").textContent = "Sblocca e importa";
      }
    };
    pwd.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById(NS + "-imp-go").click(); });
  }

  async function onImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    try {
      const text = await file.text();

      // 1) Try plain caveau first
      let data = extractVFromHTML(text);
      if (data) {
        state.V = data;
        state.curSec = 0;
        state.curItem = 0;
        state.dirty = true;
        renderNav();
        renderMain();
        toast("Importato (file in chiaro). Controlla i dati.");
        return;
      }

      // 2) Try camouflaged gate → decrypt → extract V
      const innerGate = tryDecryptCamouflage(text);
      if (!innerGate) {
        toast("Formato non riconosciuto. Serve un mkcaveau.html (chiaro) o un gate_*.html (criptato).");
        return;
      }

      const params = extractCryptoParams(innerGate);
      if (!params) {
        toast("Parametri crittografici non trovati nel file.");
        return;
      }

      // Ask for password
      showPasswordPromptForImport(async (password) => {
        const plainCaveau = await decryptWithPassword(params, password);
        const vData = extractVFromHTML(plainCaveau);
        if (!vData) throw new Error("V non trovato dopo decifratura");
        state.V = vData;
        state.curSec = 0;
        state.curItem = 0;
        state.dirty = true;
        renderNav();
        renderMain();
        toast("Caveau criptato sbloccato e importato. Modifica e riesporta quando vuoi.");
      }, () => {});

    } catch (err) {
      console.error(err);
      toast("Import fallito: " + (err.message || "errore"));
    }
  }

  /* ───────────────────────── EXPORT + ENCRYPT ───────────────────────── */
  function startExport() {
    const main = $(`#${NS}-main`);
    if (!main) return;
    // Replace main with password form
    const box = h("div", "pwdbox");
    box.innerHTML = `
      <h3 style="text-align:center;color:var(--acc2);letter-spacing:.15em">SIGILLA IL CAVEAU</h3>
      <p class="hint" style="text-align:center">La password non viene mai memorizzata né inviata da nessuna parte.</p>
      <div class="warnbox" role="alert">
        <b>⚠ Devi salvare e ricordare la tua password.</b> È obbligatorio: non esiste alcun modo di recuperarla né di recuperare i tuoi dati. Se la perdi o la dimentichi, il caveau è perso per sempre. Conservala in un posto sicuro (per esempio un gestore di password) e tieni il file cifrato in più di un posto.<br>
        <b>Minimo ${MIN_PWD} caratteri</b>, come da best practice: meglio una frase lunga di parole casuali.
      </div>
      <label>Password (min ${MIN_PWD} caratteri)</label>
      <input type="password" id="${NS}-p1" autocomplete="new-password" spellcheck="false">
      <div class="str"><i id="${NS}-str"></i></div>
      <label>Conferma password</label>
      <input type="password" id="${NS}-p2" autocomplete="new-password" spellcheck="false">
      <label class="ck" style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;cursor:pointer;font-size:.84rem;line-height:1.45">
        <input type="checkbox" id="${NS}-gz" style="margin-top:3px;flex:none;width:18px;height:18px">
        <span style="min-width:0"><b>Comprimi con Gzip</b> prima della cifratura<br><small style="color:var(--mu);display:block;margin-top:4px;line-height:1.4">Opzionale, disattivata di default. Riduce la dimensione del file. Richiede browser recenti (Chrome 80+, Safari 16.4+, Firefox 113+). Lascia disattivato per massima compatibilità.</small></span>
      </label>
      <div class="actions" style="justify-content:center;margin-top:14px">
        <button class="btn ghost" id="${NS}-pcancel">Annulla</button>
        <button class="btn" id="${NS}-pgo">Cripta e scarica</button>
      </div>
      <p class="hint" style="text-align:center;margin-top:10px">AES-256-GCM • PBKDF2 ${PBKDF2_ITER.toLocaleString()} iterazioni • Offline totale</p>
    `;
    main.replaceChildren(box);

    const p1 = $(`#${NS}-p1`);
    const p2 = $(`#${NS}-p2`);
    const bar = $(`#${NS}-str`);
    p1.oninput = () => {
      const v = p1.value;
      const uniq = new Set(v).size;
      let score = Math.min(100, v.length * 5);          // la lunghezza conta: 20+ caratteri = barra piena
      if (uniq < 8) score = Math.min(score, 30);        // troppo ripetitiva
      bar.style.width = score + "%";
      bar.style.background = (v.length < MIN_PWD || uniq < 8) ? "var(--bad)" : v.length < 20 ? "#f0b35a" : "var(--ok)";
    };
    $(`#${NS}-pcancel`).onclick = () => renderMain();
    $(`#${NS}-pgo`).onclick = async () => {
      const a = p1.value;
      const b = p2.value;
      if (a.length < MIN_PWD) { toast("Password troppo corta (min " + MIN_PWD + ")"); return; }
      if (new Set(a).size < 8) { toast("Password troppo ripetitiva"); return; }
      if (a !== b) { toast("Le password non coincidono"); return; }
      try {
        $(`#${NS}-pgo`).disabled = true;
        $(`#${NS}-pgo`).textContent = "Derivazione chiave…";
        const plain = buildCaveauHTML(state.V);
        const gzEl = document.getElementById(NS + "-gz");
        const algo = (gzEl && gzEl.checked) ? "gzip" : null;
        const enc = await encryptPayload(plain, a, algo);
        // Clear passwords immediately
        p1.value = "";
        p2.value = "";
        $(`#${NS}-pgo`).textContent = "Applicazione mimetizzazione…";
        const gate = buildGateShell(enc);
        const finalHtml = applyCamouflage(gate);
        const blob = new Blob([finalHtml], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const aEl = document.createElement("a");
        aEl.href = url;
        aEl.download = `gate_mkcaveau_${new Date().toISOString().slice(0, 10)}.html`;
        aEl.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        toast("Portale sigillato e scaricato.");
        setTimeout(renderMain, 800);
      } catch (err) {
        console.error(err);
        toast("Errore crittografia: " + (err.message || "sconosciuto"));
        $(`#${NS}-pgo`).disabled = false;
        $(`#${NS}-pgo`).textContent = "Cripta e scarica";
      }
    };
  }

  /* ───────────────────────── BOOT ───────────────────────── */
  function bind() {
    const el = document.getElementById("MKCaveauMaker");
    if (el) {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        openModal();
      });
      // Optional visual cue
      if (!el.title) el.title = "Apri MKCaveau Maker";
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bind);
  } else {
    bind();
  }

  // Public escape hatch (still collision-safe)
  window.MKCaveauMakerOpen = openModal;
})();
